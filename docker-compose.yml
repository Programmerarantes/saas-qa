services:
  postgres:
    image: postgres:16-alpine
    container_name: qa-saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_pass
      POSTGRES_DB: qa_saas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./backend/db/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d qa_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: qa-saas-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://qa_user:qa_pass@postgres:5432/qa_saas
      PORT: 3000
      FRONTEND_ORIGIN: http://localhost:5173
      ADMIN_EMAIL: admin@softwarequalitylab.local
      ADMIN_PASSWORD: ChangeMe123!
      LAB_DEMO_EMAIL: demo@lab.local
      LAB_DEMO_PASSWORD: LabPass123!
      JWT_SECRET: local-admin-secret-change-me
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

volumes:
  pgdata:
